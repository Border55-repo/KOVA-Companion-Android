<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d2440"><title>KOVA Companion – PIN</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(140deg,#091a31,#17406a);display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;color:#10243a;padding:20px}.panel{background:white;border-radius:20px;padding:32px 26px;max-width:390px;width:100%;box-shadow:0 20px 80px #0005;text-align:center}h1{margin:0 0 10px;font-size:1.65rem}p{color:#566478}label{display:block;font-weight:600;margin:25px 0 9px}input{font-size:26px;letter-spacing:9px;text-align:center;width:100%;padding:13px;border-radius:10px;border:2px solid #a4b2c4}button{width:100%;border:0;border-radius:10px;padding:15px;font-size:1.05rem;font-weight:700;background:#1265bb;color:white;margin-top:15px;cursor:pointer}#message{min-height:1.5em;color:#b42318;font-weight:600}small{color:#617183}</style></head><body><main class="panel"><h1>KOVA Companion</h1><p>Angi PIN-koden for å åpne nettsiden</p><form id="form"><label for="pin">PIN-kode</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required autofocus aria-describedby="message"><button type="submit">Åpne KOVA Companion</button></form><p id="message" role="alert"></p><small>Fire sifre</small></main><script>
document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();const v=document.getElementById('pin').value;if(v==='2026'){window.location.replace('https://border55-repo.github.io/KOVA-Companion-Android/');}else{document.getElementById('message').textContent='Feil PIN-kode. Prøv igjen.';document.getElementById('pin').value='';document.getElementById('pin').focus();}});
</script></body></html>
