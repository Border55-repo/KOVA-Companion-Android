name: Bridge and PWA gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bridge/*.py"
      - "bridge/requirements.txt"
      - "pwa/**"
      - ".github/workflows/v1-rc-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "bridge/*.py"
      - "bridge/requirements.txt"
      - "pwa/**"
      - ".github/workflows/v1-rc-gate.yml"

permissions:
  contents: read

jobs:
  bridge-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Bridge dependencies
        run: pip install -r bridge/requirements.txt
      - name: Bridge unit tests
        working-directory: bridge
        run: python -m unittest test_sync.py test_reminders.py test_announcement.py test_targeted_announcement.py test_release_notice.py test_personal_reminders.py test_push_selftest.py test_webpush.py test_admin_sync_request.py

  pwa-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PWA unit tests
        run: node --test pwa/tests/*.test.mjs

