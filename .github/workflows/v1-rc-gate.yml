name: v1 RC gate

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "bridge/*.py"
      - "bridge/requirements.txt"
      - ".github/workflows/v1-rc-gate.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "bridge/*.py"
      - "bridge/requirements.txt"
      - ".github/workflows/v1-rc-gate.yml"

permissions:
  contents: read

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Android unit tests
        run: gradle :app:testDebugUnitTest

      - name: Android lint and accessibility checks
        run: gradle :app:lintDebug

  bridge-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bridge dependencies
        run: pip install -r bridge/requirements.txt

      - name: Bridge unit tests
        working-directory: bridge
        run: python -m unittest test_sync.py test_reminders.py test_announcement.py
