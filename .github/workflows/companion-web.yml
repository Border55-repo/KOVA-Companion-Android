name: Kova Companion web
on:
  push:
    branches: [main]
    paths: ['pwa/**', '.github/workflows/companion-web.yml']
  pull_request:
    paths: ['pwa/**', '.github/workflows/companion-web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r bridge/requirements.txt
      - run: python -m unittest test_announcement test_webpush test_targeted_announcement
        working-directory: bridge
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test pwa/tests/*.test.mjs
      - run: |
          mkdir -p web-dist
          cp pwa/*.html pwa/*.js pwa/*.css pwa/*.json pwa/*.svg pwa/*.webmanifest web-dist/
          cp -r pwa/admin web-dist/admin
          rm web-dist/package.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web-dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: [check, bridge-check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
