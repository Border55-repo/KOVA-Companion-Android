name: Cloudflare dispatcher checks
on:
  push:
    paths: ['cloudflare/**', '.github/workflows/cloudflare-dispatch.yml']
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/cloudflare-dispatch.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloudflare/worker.test.mjs
