name: FCM smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/test-push-trigger.txt"
      - "bridge/test_push.py"
      - ".github/workflows/fcm-smoke-test.yml"

permissions:
  contents: read

jobs:
  test-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FCM dependencies
        run: pip install -r bridge/requirements.txt

      - name: Verify Firebase secret exists
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Repository secret FIREBASE_SERVICE_ACCOUNT_JSON is missing."
            exit 2
          fi

      - name: Send added push to Ullensaker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_ORG: UllensakerRKH
          TEST_KIND: added
          TEST_EVENT_ID: smoke-test-added-v2
          TEST_TITLE: "Ny KOVA-aktivitet – test"
          TEST_BODY: "Test av varsel for ny aktivitet."
        run: python bridge/test_push.py

      - name: Send changed push to Ullensaker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_ORG: UllensakerRKH
          TEST_KIND: changed
          TEST_TITLE: "KOVA-aktivitet endret – test"
          TEST_BODY: "Test av varsel for endret aktivitet."
        run: python bridge/test_push.py

      - name: Send removed push to Ullensaker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_ORG: UllensakerRKH
          TEST_KIND: removed
          TEST_TITLE: "KOVA-aktivitet fjernet – test"
          TEST_BODY: "Test av varsel for fjernet aktivitet."
        run: python bridge/test_push.py
