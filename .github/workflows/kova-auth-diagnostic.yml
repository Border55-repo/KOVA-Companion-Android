name: KOVA Auth Diagnostic

on:
  push:
    paths:
      - "bridge/check_auth_provider.py"
      - ".github/workflows/kova-auth-diagnostic.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Check Email Password provider
        env:
          FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}
        run: python bridge/check_auth_provider.py
