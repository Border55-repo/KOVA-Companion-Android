name: Provision PWA Push Backend

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/firestore_setup.py"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firebase-web-push-backend.yml"

permissions:
  contents: read

concurrency:
  group: firebase-web-push-backend
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r bridge/requirements.txt

      - name: Ensure Firestore database
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIRESTORE_LOCATION: eur3
        run: python bridge/firestore_setup.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Deploy write-only subscription rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only firestore:rules --project kova-companion --non-interactive
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
