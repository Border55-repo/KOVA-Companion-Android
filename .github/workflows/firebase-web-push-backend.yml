name: Provision PWA Push Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bridge/firestore_setup.py"
      - "bridge/deploy_firestore_rules.py"
      - "bridge/requirements.txt"
      - "bridge/webpush.py"
      - "bridge/test_webpush_rules.py"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firebase-web-push-backend.yml"

permissions:
  contents: write

concurrency:
  group: firebase-web-push-backend
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r bridge/requirements.txt

      - name: Ensure Firestore database
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIRESTORE_LOCATION: eur3
        run: python bridge/firestore_setup.py

      - name: Deploy write-only subscription rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python bridge/deploy_firestore_rules.py

      - name: Live Web Push rules probe
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python bridge/test_webpush_rules.py

      - name: Ensure persistent VAPID config
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: PYTHONPATH=bridge python -c "from webpush import ensure_vapid_config; ensure_vapid_config()"

      - name: Commit public Web Push config
        run: |
          if [ -z "$(git status --porcelain -- bridge/data/webpush-config.json)" ]; then
            echo "Web Push public config unchanged."
            exit 0
          fi
          git config user.name "KOVA Companion Web Push"
          git config user.email "actions@users.noreply.github.com"
          git add bridge/data/webpush-config.json
          git commit -m "Update Web Push public config"
          git pull --rebase origin main
          git push origin HEAD:main
