name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify tag matches Android version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$VERSION"
            exit 1
          fi

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Missing required Android signing secrets."
            exit 2
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/kova-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          if [ -n "$ANDROID_KEY_ALIAS_SECRET" ]; then
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEY_ALIAS=kova" >> "$GITHUB_ENV"
          fi

          if [ -n "$ANDROID_KEY_PASSWORD_SECRET" ]; then
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: gradle :app:testReleaseUnitTest

      - name: Build signed release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature
        run: |
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify             --verbose             --print-certs             app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk             "release-assets/KOVA-Companion-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab             "release-assets/KOVA-Companion-$GITHUB_REF_NAME.aab"
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             release-assets/*             --title "KOVA Companion $GITHUB_REF_NAME"             --generate-notes
