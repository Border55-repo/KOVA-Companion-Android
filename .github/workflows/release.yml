name: Android release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Resolve release version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"

          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $TAG"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64."
            exit 2
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/kova-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Unit tests
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testReleaseUnitTest

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature
        run: |
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify             --verbose             --print-certs             app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk             "release-assets/KOVA-Companion-$TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab             "release-assets/KOVA-Companion-$TAG.aab"
          cd release-assets
          sha256sum "KOVA-Companion-$TAG.apk" "KOVA-Companion-$TAG.aab" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG"               release-assets/*               --target "$GITHUB_SHA"               --title "KOVA Companion $TAG"               --generate-notes
          fi

      - name: Update public app manifest
        run: |
          mkdir -p bridge/data
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > bridge/data/app-update.json <<EOF
          {
            "schemaVersion": 1,
            "tagName": "$TAG",
            "name": "KOVA Companion $TAG",
            "notes": "Ny KOVA Companion-versjon er tilgjengelig.",
            "publishedAt": "$PUBLISHED_AT",
            "htmlUrl": "https://github.com/Border55-repo/KOVA-Companion-Android/releases/tag/$TAG",
            "apkUrl": "https://github.com/Border55-repo/KOVA-Companion-Android/releases/download/$TAG/KOVA-Companion-$TAG.apk"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge/data/app-update.json

          if git diff --cached --quiet; then
            echo "Update manifest already current."
            exit 0
          fi

          git commit -m "Update app manifest for $TAG"
          git pull --rebase origin main
          git push origin HEAD:main

