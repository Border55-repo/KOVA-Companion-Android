name: Deploy KOVA PWA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "pwa/**"
      - "bridge/data/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static PWA
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R pwa/. _site/
          mkdir -p _site/data
          cp -R bridge/data/. _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
