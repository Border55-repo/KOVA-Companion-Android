name: KOVA user announcement

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/announcement-trigger.txt"

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r bridge/requirements.txt
      - name: Send latest changes to KOVA Companion users
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANNOUNCEMENT_ID: "kova-2-0-1-latest-changes"
          ANNOUNCEMENT_TITLE: "Nytt i KOVA Companion 2.0.1 🎉"
          ANNOUNCEMENT_BODY: "Nytt nå: påminnelse 7 og 14 dager før vakten, automatisk aktivert etter oppdatering, samt forbedret varslingsflyt i app og PWA."
        run: PYTHONPATH=bridge python bridge/broadcast_announcement.py
