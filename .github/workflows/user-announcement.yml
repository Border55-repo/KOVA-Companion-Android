name: KOVA user announcement

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/announcement-trigger.txt"

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r bridge/requirements.txt
      - name: Send latest changes to KOVA Companion users
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANNOUNCEMENT_ID: "kova-corps-affiliation-20260924"
          ANNOUNCEMENT_TITLE: "Nytt i KOVA Companion 🚑"
          ANNOUNCEMENT_BODY: "Nytt: medlemmer med flere korps kan velge Hoved Korps og Korps med Aktivitetstilknytning. Valgene brukes for vakter og varsler."
        run: PYTHONPATH=bridge python bridge/broadcast_announcement.py
