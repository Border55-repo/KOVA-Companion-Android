name: KOVA user announcement

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/announcement-trigger.txt"

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r bridge/requirements.txt
      - name: Send latest changes to KOVA Companion users
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANNOUNCEMENT_ID: "kova-update-20260924-2"
          ANNOUNCEMENT_TITLE: "Nytt i KOVA Companion 🚑"
          ANNOUNCEMENT_BODY: "Oppdatert korpsvalg: én enkel liste med Favoritt og Følg. Korps uten aktive vakter skjules automatisk. Flere forbedringer er på vei."
        run: PYTHONPATH=bridge python bridge/broadcast_announcement.py
