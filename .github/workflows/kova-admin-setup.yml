name: Provision KOVA Admin

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/provision_admin.py"
      - "bridge/requirements.txt"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/kova-admin-setup.yml"

permissions:
  contents: read

concurrency:
  group: kova-admin-setup
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r bridge/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Enable Email/Password auth provider
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only auth --project kova-companion --non-interactive
          rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Provision KOVA Admin
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          KOVA_ADMIN_TEMP_PASSWORD: ${{ secrets.KOVA_ADMIN_TEMP_PASSWORD }}
        run: python bridge/provision_admin.py

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python bridge/deploy_firestore_rules.py
