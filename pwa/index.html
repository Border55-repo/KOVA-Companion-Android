<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#c9152b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KOVA Companion">
  <title>KOVA Companion</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">RØDE KORS HJELPEKORPS</p>
      <h1>KOVA Companion</h1>
      <p class="version">Web / iPhone PWA 1.0</p>
    </div>
    <button id="installBtn" class="ghost hidden">Installer</button>
  </header>

  <main class="shell">
    <section id="installHint" class="notice ios-only hidden">
      <strong>Installer på iPhone</strong>
      <span>Åpne i Safari → Del → Legg til på Hjem-skjermen.</span>
    </section>

    <section class="status card">
      <div>
        <span class="label">Status</span>
        <strong id="statusText">Laster KOVA…</strong>
      </div>
      <button id="refreshBtn" class="small">Oppdater</button>
    </section>

    <section class="controls card">
      <label>
        <span>Hjelpekorps</span>
        <select id="orgSelect"></select>
      </label>
      <label>
        <span>Søk</span>
        <input id="searchInput" type="search" placeholder="Aktivitet, type eller dato">
      </label>
      <div class="segmented" id="viewTabs">
        <button data-view="all" class="active">Alle</button>
        <button data-view="week">7 dager</button>
        <button data-view="month">30 dager</button>
        <button data-view="favorites">Mine</button>
      </div>
    </section>

    <section class="actions">
      <a class="primary" href="https://www.kova.no/" target="_blank" rel="noopener">Logg inn / Åpne KOVA</a>
    </section>

    <section>
      <div class="section-head">
        <div>
          <span class="label">Aktiviteter</span>
          <h2 id="orgTitle">KOVA</h2>
        </div>
        <span id="eventCount" class="badge">0</span>
      </div>
      <div id="events" class="event-list"></div>
      <div id="empty" class="empty hidden">Ingen aktiviteter matcher valget.</div>
    </section>
  </main>

  <dialog id="detailDialog">
    <article>
      <button id="closeDialog" class="dialog-close" aria-label="Lukk">×</button>
      <p id="detailType" class="eyebrow"></p>
      <h2 id="detailTitle"></h2>
      <p id="detailMeta" class="muted"></p>
      <div class="dialog-actions">
        <button id="favoriteDialogBtn" class="small"></button>
        <a id="detailKovaLink" class="primary" target="_blank" rel="noopener">Åpne KOVA</a>
      </div>
    </article>
  </dialog>

  <template id="eventTemplate">
    <article class="event-card">
      <div class="event-top">
        <span class="type"></span>
        <button class="favorite" aria-label="Favoritt">☆</button>
      </div>
      <button class="event-main">
        <h3 class="description"></h3>
        <p class="meta"></p>
      </button>
    </article>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
